[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbtmini"
version = "0.1.0"
authors = [{ name = "Ogechukwu Okoli", email = "okoliogechi74@gmail.com" }]
description = "A minimal implementation of dbt that runs on DuckDB"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "duckdb>=1.0.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.5.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.5.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
dbtmini = "dbtmini.cli:main"


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["dbtmini*"]
exclude = ["example_project*", "tests*"]
